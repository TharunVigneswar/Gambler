<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>NEON LUCK | Prize Wheel</title>

    <style>
        :root {
            --bg: #080910;
            --panel: #121421;
            --cyan: #00f5ff;
            --muted: #999db5
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #f5f5ff;
            font: 14px Arial, sans-serif;
            text-align: center
        }

        a {
            color: inherit;
            text-decoration: none
        }

        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #252638
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px
        }

        .logo span, h1 span {
            color: var(--cyan)
        }

        nav {
            display: flex;
            gap: 16px
        }

        .balance {
            color: var(--cyan);
            padding: 12px;
            border: 1px solid #00f5ff44;
            border-radius: 8px;
            font-weight: bold
        }

        main {
            max-width: 760px;
            margin: auto;
            padding: 30px 18px
        }

        .back {
            display: block;
            text-align: left;
            color: var(--muted)
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px)
        }

        p {
            color: var(--muted);
            line-height: 1.8
        }

        .panel {
            background: radial-gradient(circle at 50% 30%, #ffe66d16, transparent 50%), var(--panel);
            padding: 28px;
            border: 1px solid #292b40;
            border-radius: 18px
        }

        .wheel-wrap {
            position: relative;
            width: min(270px, 75vw);
            aspect-ratio: 1;
            margin: 25px auto
        }

        .pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid white
        }

        .wheel {
            width: 100%;
            height: 100%;
            border: 7px solid #ffe66d;
            border-radius: 50%;
            background: conic-gradient(#00f5ff 0deg 45deg, #a855f7 45deg 90deg, #ff3cac 90deg 135deg, #ffe66d 135deg 180deg, #00f5ff 180deg 225deg, #a855f7 225deg 270deg, #ff3cac 270deg 315deg, #ffe66d 315deg 360deg);
            box-shadow: 0 0 30px #00f5ff22;
            transition: transform 3s cubic-bezier(.12, .7, .1, 1)
        }

        button {
            padding: 14px 22px;
            background: var(--cyan);
            color: #080910;
            border: 0;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        #result {
            min-height: 45px;
            color: var(--cyan);
            font-weight: bold;
            margin: 20px 0;
            line-height: 1.7
        }

        .rewards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px
        }

        .rewards span {
            background: #1b1e30;
            border: 1px solid #33364b;
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px
        }

        @media(max-width:520px) {
            header {
                flex-wrap: wrap
            }

            nav {
                order: 3;
                width: 100%;
                justify-content: center
            }

            .panel {
                padding: 18px
            }
        }
    </style>
</head>

<body>
    <header>
        <a class="logo" href="index.html">NEON<span>LUCK</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="explore.html">Games</a>
        </nav>
        <div class="balance">◉ <span id="balance">10,000</span> NC</div>
    </header>

    <main>
        <a class="back" href="explore.html">← All Games</a>
        <p>GAME 03 / SPIN FOR REWARDS</p>
        <h1>PRIZE <span>WHEEL.</span></h1>
        <p>Each spin costs 500 NC. Spin to reveal your virtual reward.</p>

        <div class="panel">
            <div class="wheel-wrap">
                <div class="pointer"></div>
                <div class="wheel" id="wheel"></div>
            </div>

            <button id="spin">SPIN FOR 500 NC ↗</button>
            <div id="result">YOUR REWARD IS WAITING</div>

            <div class="rewards">
                <span>0 NC</span>
                <span>250 NC</span>
                <span>500 NC</span>
                <span>750 NC</span>
                <span>1,000 NC</span>
                <span>1,500 NC</span>
                <span>2,500 NC</span>
            </div>

            <p>Rare rewards have a lower chance of appearing. No real money is involved.</p>
        </div>
    </main>

    <script>
        const KEY = "neonLuckBalance";
        if (localStorage.getItem(KEY) === null) localStorage.setItem(KEY, "10000");

        const $ = id => document.getElementById(id);
        let busy = false, rotation = 0;

        function bal() {
            return Number(localStorage.getItem(KEY) || 0)
        }

        function show() {
            $("balance").textContent = bal().toLocaleString()
        }

        function add(n) {
            localStorage.setItem(KEY, String(bal() + n));
            show()
        }

        function weighted(items) {
            let r = Math.random() * items.reduce((s, x) => s + x.weight, 0);

            for (const x of items) {
                r -= x.weight;
                if (r < 0) return x.value
            }

            return items[items.length - 1].value;
        }

        show();
        window.addEventListener("storage", show);

        $("spin").onclick = () => {
            if (busy) return;

            const cost = 500;

            if (bal() < cost) {
                $("result").textContent = "NOT ENOUGH NC — YOU NEED 500 NC.";
                return
            }

            add(-cost);
            busy = true;
            $("spin").disabled = true;
            $("result").textContent = "THE WHEEL IS SPINNING...";

            const reward = weighted([
                {value: 0, weight: 10},
                {value: 250, weight: 20},
                {value: 500, weight: 30},
                {value: 750, weight: 20},
                {value: 1000, weight: 12},
                {value: 1500, weight: 6},
                {value: 2500, weight: 2}
            ]);

            rotation += 1800 + Math.random() * 1440;
            $("wheel").style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                if (reward > 0) add(reward);

                $("result").textContent = reward === 0
                    ? "NO PRIZE THIS TIME — 500 NC SPENT"
                    : `YOU WON ${reward.toLocaleString()} NC! NET: ${(reward - cost > 0 ? "+" : "") + (reward - cost).toLocaleString()} NC`;

                busy = false;
                $("spin").disabled = false;
                $("spin").textContent = "SPIN AGAIN · 500 NC";
            }, 3050);
        };
    </script>
</body>
</html>
